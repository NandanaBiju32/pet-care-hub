
<!DOCTYPE html>
<html lang="en">
{% extends 'base.html' %}
{% load static %}
{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Pet</title>

    <link rel="stylesheet" href="{% static 'css/add_pet.css' %}">
</head>
<body>

<div class="form-container">

    <div class="form-box">

        <h1>Add Pet For Adoption</h1>

        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   name="pet_type"
                   placeholder="Pet Type"
                   required>

            <input type="text"
                   name="breed"
                   placeholder="Breed"
                   required>

            <input type="text"
                   name="name"
                   placeholder="Pet Name"
                   required>

            <input type="text"
                   name="place"
                   placeholder="Place"
                   required>

            <input type="text"
                   name="age"
                   placeholder="Age"
                   required>

            <input type="text"
                   name="weight"
                   placeholder="Weight"
                   required>

            <input type="text"
                   name="owner_name"
                   placeholder="Owner Name"
                   required>

            <input type="text"
                   name="contact"
                   placeholder="Contact Details"
                   required>

<!--            <input type="file"-->
<!--                   name="image"-->
<!--                   placeholder="Pet Image URL"-->
<!--                   required>-->

            <button type="submit">
                Add Pet
            </button>

        </form>

        <a href="{% url 'adopt' %}" class="back-btn">
            Back
        </a>

    </div>

</div>
{% endblock %}
</body>
</html>
