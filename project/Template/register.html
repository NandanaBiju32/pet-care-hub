
<!DOCTYPE html>
{% extends 'base.html' %}
{% load static %}
{% block content %}
<html>
<head>

    <title>Register</title>

    <link rel="stylesheet"
          href="{% static 'css/auth.css' %}">

</head>

<body>

<div class="auth-container">

    <form method="POST"
          class="auth-form">

        {% csrf_token %}

        <h1>Register</h1>

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">

            Register

        </button>

        <p>

            Already have an account?

            <a href="{% url 'login' %}">

                Login

            </a>

        </p>

    </form>

</div>
{% endblock %}
</body>
</html>
